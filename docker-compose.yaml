version: "3.9"

services:
  database:
    image: postgres:17
    container_name: ptcgo_db
    environment:
      - POSTGRES_HOST=${DB_HOST}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - 5432:5432
    networks:
      - compose-bridge

  redis:
    container_name: ptcgo_cache
    image: redis
    volumes:
      - redis:/data
    ports:
      - 6379:6379
    networks:
      - compose-bridge

  redis-commander:
    container_name: ptcgo_cache_commander
    hostname: redis-commander
    image: ghcr.io/joeferner/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - 8081:8081
    networks:
      - compose-bridge

volumes:
  redis:
    driver: local

networks:
  compose-bridge:
    # A bridge network uses a software bridge which allows containers connected to the same bridge network to communicate,
    # while providing isolation from containers which are not connected to that bridge network.
    driver: bridge
